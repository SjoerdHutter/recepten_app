id: appeltaart
title: Appeltaart van de goudreinet
description: De klassieke Hollandse appeltaart. Even werk, maar hij gaat met gemak twaalf punten lang mee.
times:
  prep: 30
  active: 15
  passive: 65
methods: [bakken, oven]
difficulty: uitdagend
pans: 2
servings: 12
ingredients:
  - { amount: 300, unit: g, ingredientId: zelfrijzend-bakmeel }
  - { amount: 200, unit: g, ingredientId: boter, note: "koud, in blokjes" }
  - { amount: 150, unit: g, ingredientId: bruine-suiker }
  - { amount: 1, unit: stuks, ingredientId: ei, note: "losgeklopt, een deel voor het bestrijken" }
  - { amount: 1, unit: snufje, ingredientId: zout }
  - { amount: 1, unit: kg, ingredientId: appel, note: "goudreinetten, geschild en in partjes" }
  - { amount: 2, unit: tl, ingredientId: kaneel }
  - { amount: 8, unit: g, ingredientId: vanillesuiker }
  - { amount: 2, unit: el, ingredientId: paneermeel }
  - { amount: 75, unit: g, ingredientId: rozijnen, optional: true }
  - { amount: 1, unit: stuks, ingredientId: citroen, note: alleen het sap }
  - { amount: 1, unit: el, ingredientId: bloem, scales: fixed, note: om de vorm mee te bestuiven }
steps:
  - text: Kneed het bakmeel, de boter, de bruine suiker, het zout en tweederde van het ei snel tot een samenhangend deeg. Laat het een halfuur rusten in de koelkast.
    timer: 1800
  - text: Meng de appelpartjes met de kaneel, de vanillesuiker, het citroensap en eventueel de rozijnen. Laat even staan.
  - text: Verwarm de oven voor op 175 graden en vet een springvorm van 24 cm in. Bestuif hem met bloem.
    ovenTemp: 175
  - text: Bekleed de bodem en de rand met tweederde van het deeg. Strooi het paneermeel over de bodem, dat vangt het vocht van de appels op.
  - text: Schep de appelvulling erin en druk hem stevig aan. Rol de rest van het deeg uit en leg er repen overheen als rooster.
  - text: Bestrijk het deeg met de rest van het ei en bak de taart in ongeveer een uur goudbruin.
    timer: 3600
    ovenTemp: 175
  - text: Laat de taart volledig afkoelen voordat je de vorm eraf haalt, anders zakt hij door.
tags: [feestje, vegetarisch]
season: [9, 10, 11]
allergens: [gluten, melk, ei]
source: { type: book, title: Het Nederlandse bakboek, page: 84 }
notes: De bloem voor de vorm schaalt niet mee, want die hangt aan de vorm en niet aan het aantal punten.
