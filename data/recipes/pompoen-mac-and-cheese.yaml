id: pompoen-mac-and-cheese
title: Pompoen mac and cheese
description: Pompoen, ui en knoflook samen geroosterd en gemixt tot een romige saus, zonder roux. Met parmezaan en rucola erover.
times:
  prep: 15
  active: 15
  passive: 20
methods: [oven, koken]
difficulty: makkelijk
pans: 3
servings: 4
ingredients:
  - { amount: 600, unit: g, ingredientId: pompoen, note: "flespompoen, geschild en in stukken" }
  - { amount: 1, unit: stuks, ingredientId: ui, note: "gele of witte, gesnipperd" }
  - { amount: 4, unit: teentje, ingredientId: knoflook }
  - { amount: 2, unit: el, ingredientId: olijfolie }
  - { amount: 2, unit: takje, ingredientId: rozemarijn, note: of tijm, scales: taste }
  - { amount: 400, unit: g, ingredientId: pasta, note: macaroni }
  - { amount: 300, unit: ml, ingredientId: melk, note: "vol, of sojamelk" }
  - { amount: 3, unit: el, ingredientId: voedingsgist, scales: taste }
  - { amount: 1, unit: tl, ingredientId: mosterd, scales: taste }
  - { amount: 1, unit: snufje, ingredientId: nootmuskaat, scales: taste }
  - { amount: 40, unit: g, ingredientId: parmezaanse-kaas, note: "geraspt, om op te dienen" }
  - { amount: 60, unit: g, ingredientId: rucola, note: om op te dienen }
  - { ingredientId: zout, scales: taste }
  - { ingredientId: peper, scales: taste }
steps:
  - text: Verwarm de oven voor op 200 graden. Schep de pompoen, de gesnipperde ui en de teentjes knoflook op een bakplaat om met de olijfolie, zout en peper. Leg de takjes rozemarijn ertussen.
    ovenTemp: 200
  - text: Rooster 20 minuten, tot de ui en de knoflook bruin zijn en de pompoen zacht is.
    timer: 1200
    ovenTemp: 200
  - text: Kook ondertussen de pasta beetgaar volgens de verpakking. Schep een mok pastawater opzij voordat je afgiet.
  - text: Haal de rozemarijn van de bakplaat en doe de pompoen, ui en knoflook in de keukenmachine. Voeg de voedingsgist, de mosterd, de nootmuskaat, zout en peper toe.
  - text: Mix met de melk tot een gladde, romige saus. Proef, en kijk of er nog zout, peper of voedingsgist bij moet.
  - text: Roer de saus door de pasta en doe er pastawater bij tot hij bindt en om de pasta blijft hangen.
  - text: Dien op met de geraspte parmezaan en een handvol rucola erover.
tags: [pasta, westers, vegetarisch, gezond]
season: [1, 2, 9, 10, 11, 12]
allergens: [gluten, melk, mosterd]
source: { type: text, text: Eigen recept }
notes: Veganistisch met sojamelk en zonder parmezaan; doe er dan een extra eetlepel voedingsgist bij. Hoe meer pastawater, hoe soepeler de saus om de macaroni gaat zitten.
